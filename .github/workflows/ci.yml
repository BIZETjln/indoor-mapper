name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: PC Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: pc-slam-backend
        run: pip install -r requirements.txt
      - name: Syntax check
        working-directory: pc-slam-backend
        run: python -m compileall src
      - name: Run tests
        working-directory: pc-slam-backend
        run: pytest tests/ || echo "no tests yet"

  viewer:
    name: Web Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json
      - name: Install deps
        working-directory: web-viewer
        run: npm install
      - name: Build
        working-directory: web-viewer
        run: npm run build
