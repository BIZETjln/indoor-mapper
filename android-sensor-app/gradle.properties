# Mémoire allouée à la JVM Gradle. 2 GB suffit pour ce projet, monte à 4G si build lent.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Active le build parallèle entre modules (utile quand on aura plusieurs modules).
org.gradle.parallel=true

# Cache les résultats de tâches entre builds (gain de temps énorme).
org.gradle.caching=true

# AndroidX = obligatoire sur les projets modernes.
android.useAndroidX=true

# Kotlin code style officiel (au lieu de l'ancien style "obsolete").
kotlin.code.style=official

# Désactive la génération des BuildConfig (on n'en a pas besoin).
android.defaults.buildfeatures.buildconfig=false

# Coupe les warnings sur les dépendances dépréciées (verbeux et inutile).
android.nonTransitiveRClass=true
